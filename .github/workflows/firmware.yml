# Builds the location display's firmware for every kind of board and runs its tests on the computer.
#
# On a pull request that touches the firmware it only checks that everything builds.
#
# On a tag such as firmware-v0.3.3 it builds that version and publishes it, which Wrkbench servers then offer to
# their displays (Settings, Displays). The version comes from the tag, so a release needs no commit. Either:
# - on GitHub, Releases, "Draft a new release", a new tag firmware-v0.3.3 on main, Publish: this workflow then
#   attaches the images and firmware-manifest.json to that release; or
# - push the tag (git tag firmware-v0.3.3 && git push origin firmware-v0.3.3): this workflow makes the release.
# A tag with a suffix (firmware-v0.3.3-rc1) is published as a pre-release of 0.3.3, offered only by servers with
# FIRMWARE_PRERELEASES=true.
name: Display firmware

on:
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  push:
    tags: ['firmware-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: firmware/cyd
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/cyd/platformio.ini') }}

      - name: Install PlatformIO and esptool
        run: pip install platformio==6.2.0 esptool==5.6.0

      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/firmware-v')
        run: |
          tag="${GITHUB_REF_NAME#firmware-v}"
          version="${tag%%-*}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Name the tag firmware-v<version>, such as firmware-v0.3.3 (or firmware-v0.3.3-rc1 for a pre-release)."
            exit 1
          fi
          echo "WB_FIRMWARE_VERSION=$version" >> "$GITHUB_ENV"
          if [ "$tag" != "$version" ]; then echo "PRERELEASE=1" >> "$GITHUB_ENV"; fi
          echo "Building firmware $version"

      - name: Test (wb_core, wb_bambu)
        run: pio test -e native

      - name: Build every board
        run: pio run -e cyd-st7789 -e cyd-ili9341 -e cyd24-st7789

      - name: Package
        run: python tools/package_release.py --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: display-firmware
          path: firmware/cyd/dist/

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/firmware-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # Made on GitHub's website: keep its title and notes, and add the files.
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* ${PRERELEASE:+--prerelease} \
              --title "Display firmware $WB_FIRMWARE_VERSION" \
              --notes "Firmware $WB_FIRMWARE_VERSION for Wrkbench location displays. Servers offer it under Settings, Displays, to displays on firmware 0.3.0 or later; older ones are flashed once (Settings, Displays, Flash a new display)."
          fi
