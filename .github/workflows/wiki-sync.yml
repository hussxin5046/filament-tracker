# Publishes docs/wiki to the repository's GitHub wiki, so the guides are kept in one place.
# Runs when the pages change on main, or by hand from the Actions tab.
#
# One-time set-up: turn on Wikis in the repository settings and save any first page in the
# Wiki tab. Until then the wiki has no git repository and this workflow fails at "Check out the wiki".
name: Publish wiki

on:
  push:
    branches: [main]
    paths: ['docs/wiki/**', 'scripts/build-wiki.mjs', '.github/workflows/wiki-sync.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build the wiki pages
        run: node scripts/build-wiki.mjs "$RUNNER_TEMP/wiki-build"

      - name: Check out the wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"

      - name: Replace the wiki's contents and push
        working-directory: ${{ runner.temp }}/wiki
        run: |
          # Everything except git's own folder is replaced, so pages removed from docs/wiki go too.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$RUNNER_TEMP/wiki-build/." .
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update from docs/wiki at ${GITHUB_SHA::7}"
          git push
