; Wrkbench location display for the CYD (ESP32-2432S028R, 2.8" 320x240, resistive touch). A 2.4" CYD wired the
; same way (ST7789 IPS panel, backlight on 21, touch on its own pins) uses the cyd24-* envs.
;
; The USB-C version of this board ships with either an ST7789 or an ILI9341 panel, and nothing on the board says
; which. Flash cyd-st7789 first; if colours look wrong or inverted, flash cyd-ili9341 instead.
;
;   pio run -e cyd-st7789 -t upload        build and flash
;   pio device monitor                     serial output
;   pio run -e bringup-st7789 -t upload    colour bars and touch test, to check a new board
;   pio test -e native                     host tests of lib/wb_core (needs a C++ compiler)

[platformio]
default_envs = cyd-st7789

[cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
; Two 1.9 MB app slots, so a later firmware can be sent over Wi-Fi. Settings (nvs) sit where they always did.
board_build.partitions = min_spiffs.csv
lib_deps_display =
  bodmer/TFT_eSPI@2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
; TFT_eSPI is configured here rather than by editing its User_Setup.h.
; Display on HSPI (MISO 12, MOSI 13, SCLK 14, CS 15, DC 2, backlight 21); touch has its own pins (see display.cpp).
build_flags_display =
  -DUSER_SETUP_LOADED=1
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DUSE_HSPI_PORT=1
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DSMOOTH_FONT=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=16000000
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
build_flags_st7789 =
  -DST7789_DRIVER=1
  ; The USB-C CYD's ST7789 panel wants blue first: with TFT_RGB, red and blue come out swapped.
  -DTFT_RGB_ORDER=TFT_BGR
  -DWB_PANEL=\"st7789\"
; The 2.8" USB-C board's ST7789 panel shows everything as a negative with the driver's usual inversion (a white
; background, black spools white), so its builds switch inversion off. Seen on a real board; the 2.4" IPS panel
; needs it on and does not use this.
build_flags_28_st7789 =
  -DWB_INVERT=0
; The 2.4" board: same wiring, its touch panel reads a different range (raw corners measured on a real one).
build_flags_24 =
  -DWB_BOARD=\"24\"
  -DWB_TOUCH_X_MIN=380
  -DWB_TOUCH_X_MAX=3790
  -DWB_TOUCH_Y_MIN=560
  -DWB_TOUCH_Y_MAX=3520
build_flags_ili9341 =
  -DILI9341_2_DRIVER=1
  -DWB_PANEL=\"ili9341\"

; ---- The display firmware ---------------------------------------------------------------------
[app]
extends = cyd
build_src_filter = +<*> -<bringup/>
lib_deps =
  ${cyd.lib_deps_display}
  lvgl/lvgl@9.2.2
  bblanchon/ArduinoJson@7.2.1
  https://github.com/tzapu/WiFiManager.git#v2.0.17
  adafruit/Adafruit PN532@1.3.4
build_flags =
  ${cyd.build_flags_display}
  -DLV_CONF_INCLUDE_SIMPLE=1
  -DLV_LVGL_H_INCLUDE_SIMPLE=1
  -Iinclude
; The firmware's version: a release takes it from its tag (tools/version.py); this is the default for other builds.
custom_wb_version = 0.4.0
extra_scripts = pre:tools/version.py

[env:cyd-st7789]
extends = app
build_flags =
  ${app.build_flags}
  ${cyd.build_flags_st7789}
  ${cyd.build_flags_28_st7789}

[env:cyd-ili9341]
extends = app
build_flags =
  ${app.build_flags}
  ${cyd.build_flags_ili9341}

; For working on the firmware: also accepts new firmware over Wi-Fi, with a password taken from the
; WB_OTA_PASSWORD environment variable (set it before building, and never commit it). Flash it over USB once,
; then:  pio run -e cyd-st7789-dev -t upload --upload-port <the display's IP address>
[env:cyd-st7789-dev]
extends = app
build_flags =
  ${app.build_flags}
  ${cyd.build_flags_st7789}
  ${cyd.build_flags_28_st7789}
  -DWB_OTA_PASSWORD=\"${sysenv.WB_OTA_PASSWORD}\"
upload_flags = --auth=${sysenv.WB_OTA_PASSWORD}

[env:cyd24-st7789]
extends = app
build_flags =
  ${app.build_flags}
  ${cyd.build_flags_st7789}
  ${cyd.build_flags_24}

; The 2.4" board's developer build, updated over Wi-Fi like cyd-st7789-dev.
[env:cyd24-st7789-dev]
extends = app
build_flags =
  ${app.build_flags}
  ${cyd.build_flags_st7789}
  ${cyd.build_flags_24}
  -DWB_OTA_PASSWORD=\"${sysenv.WB_OTA_PASSWORD}\"
upload_flags = --auth=${sysenv.WB_OTA_PASSWORD}

; ---- Bring-up: colour bars and touch, nothing else --------------------------------------------
[bringup]
extends = cyd
build_src_filter = +<bringup/>
lib_deps = ${cyd.lib_deps_display}

[env:bringup-st7789]
extends = bringup
build_flags =
  ${cyd.build_flags_display}
  ${cyd.build_flags_st7789}

[env:bringup-ili9341]
extends = bringup
build_flags =
  ${cyd.build_flags_display}
  ${cyd.build_flags_ili9341}

; ---- Tests of the pure logic in lib/wb_core ---------------------------------------------------
; On the board (no compiler needed on the computer): pio test -e test-board
[env:test-board]
extends = cyd
test_framework = unity
build_src_filter = -<*>
lib_deps = bblanchon/ArduinoJson@7.2.1

; On the computer, with a C++ compiler installed: pio test -e native
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
lib_deps = bblanchon/ArduinoJson@7.2.1
build_flags = -std=gnu++17
